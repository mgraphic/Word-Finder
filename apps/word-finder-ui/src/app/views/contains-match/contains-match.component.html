<form (ngSubmit)="search()" class="mb-3">
    <div class="mb-3 input-field">
        <div class="form-lable">Start With: (optional)</div>
        <input
            name="starts-with"
            type="search"
            class="form-control"
            placeholder="Starts with..."
            aria-label="Starts with"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            [(ngModel)]="startsWith"
        />
    </div>

    <div class="mb-3 input-field">
        <div class="form-lable">Contains: (optional)</div>
        <input
            name="contains"
            type="search"
            class="form-control"
            placeholder="Contains..."
            aria-label="Contains"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            [(ngModel)]="contains"
        />
    </div>

    <div class="mb-3 input-field">
        <div class="form-lable">Ends With: (optional)</div>
        <input
            name="ends-with"
            type="search"
            class="form-control"
            placeholder="Ends with..."
            aria-label="Ends with"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            [(ngModel)]="endsWith"
        />
    </div>

    <div class="mb-3 input-field">
        <div class="form-lable">Length: (optional, minimum 3)</div>
        <input
            name="length"
            type="number"
            class="form-control"
            placeholder="Length..."
            aria-label="Length"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            [(ngModel)]="length"
        />
    </div>

    <div class="mb-3 input-field">
        <button class="btn btn-outline-secondary" type="submit">Search</button>
        <input type="submit" style="visibility: hidden; position: absolute" />
    </div>
</form>

<app-words-list-result [wordList]="foundWords()"></app-words-list-result>
